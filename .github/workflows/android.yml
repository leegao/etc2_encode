name: Build ASTC Encoder Shader
run-name: ${{ github.actor }} is building astc_enc.slang

on:
    push:
        branches-ignore: ["ci-images-dump"]
        tags: ["*"]
    pull_request:
        branches-ignore: ["ci-images-dump"]

permissions:
    contents: write
    pages: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Install System Dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    glslang-tools \
                    glslc \
                    xxd \
                    libvulkan-dev \
                    glibc-source \
                    mesa-vulkan-drivers

            - name: Set up Python environment
              uses: actions/setup-python@v6
              with:
                  python-version: "3.11"

            - name: Install Slang Compiler
              run: |
                  curl -L https://github.com/shader-slang/slang/releases/download/v2026.10.2/slang-2026.10.2-linux-x86_64.tar.gz -o slang.tar.gz
                  mkdir -p slang_extracted
                  tar -xzf slang.tar.gz -C slang_extracted
                  sudo cp slang_extracted/bin/slangc /usr/local/bin/
                  sudo cp slang_extracted/lib/*.so* /usr/local/lib/
                  sudo ldconfig /usr/local/lib
                  rm -rf slang.tar.gz slang_extracted

            - name: Install Mali Offline Compiler
              run: |
                  curl -L https://github.com/leegao/bcn_layer/releases/download/MOC/moc.zip -o moc.zip
                  sudo mkdir -p /opt/moc
                  sudo unzip moc.zip -d /opt/moc
                  ls /opt/moc

            - name: Install Frida and CLI Tools
              run: |
                  python -m pip install --upgrade pip
                  pip install frida-tools

            - name: Verify Frida Installation
              run: |
                  frida --version

            - name: Checkout source code
              uses: actions/checkout@v6

            - name: Build astc_enc.comp
              run: |
                  slangc astc_enc.slang -target glsl -line-directive-mode none -D DISABLE_RECONSTRUCTION > astc_enc.comp
                  slangc astc_enc.slang -profile glsl_450 -target spirv -o astc_enc.spv -D ENABLE_DIAGNOSTICS -D DISABLE_RECONSTRUCTION1 -entry main
                  xxd -i astc_enc.spv > astc_enc.h
                  g++ astc_enc.cpp -lvulkan -I include -L lib -l ktx -o astc_enc.out

            - name: Run malioc on astc_encoder.comp
              run: |
                  /opt/moc/mali_offline_compiler/malioc -c Mali-G615 -d --vulkan astc_enc.comp | tee malioc_output.txt
                  echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
                  cat malioc_output.txt >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

            - name: Extract MBS2
              run: |
                  frida -f /opt/moc/mali_offline_compiler/malioc -l hook.js -- -c Mali-G615 --vulkan astc_enc.comp || true

            - name: Upload Images
              uses: actions/upload-artifact@v6
              with:
                  name: output
                  path: |
                      reconstructed_astc.png
                      output.astc
                      output.ktx
                  retention-days: 14

            - name: Original image
              run: |
                  echo "## Original:" >> $GITHUB_STEP_SUMMARY
                  echo "![Original Image](https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/test.png)" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

            - name: Run astc_enc.out
              run: |
                  echo "## Running astc_enc.out ..." >> $GITHUB_STEP_SUMMARY
                  LD_LIBRARY_PATH=lib:$LD_LIBRARY_PATH ./astc_enc.out 2>&1 | tee astc_enc_output.txt
                  echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
                  cat astc_enc_output.txt >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                  mkdir -p staging_dir
                  cp ./reconstructed_astc.png staging_dir/run-${{ github.run_id }}.png
                  cp ./output.astc staging_dir/output-${{ github.run_id }}.astc
                  cp ./astc.ktx staging_dir/astc-${{ github.run_id }}.ktx
                  cp ./reconstructed_astc.png staging_dir/latest.png
                  cp ./output.astc staging_dir/output-latest.astc
                  cp ./astc.ktx staging_dir/astc-latest.ktx
                  cp ./astc_encoder.mbs2 staging_dir/astc_encoder-${{ github.run_id }}.mbs2
                  cp ./astc_encoder.mbs2 staging_dir/astc_encoder-latest.mbs2
                  cp ./astc_encoder_MBS2.c staging_dir/astc_encoder_MBS2-${{ github.run_id }}.c
                  cp ./astc_encoder_MBS2.c staging_dir/astc_encoder_MBS2-latest.c

            - name: Deploy Image to GitHub Assets Branch
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  folder: staging_dir
                  branch: ci-images-dump
                  single-commit: false

            - name: Reconstructed image
              run: |
                  echo "## Reconstructed (run-${{ github.run_id }}.png)" >> $GITHUB_STEP_SUMMARY
                  echo "![Generated Texture](https://raw.githubusercontent.com/${{ github.repository }}/ci-images-dump/run-${{ github.run_id }}.png)" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "## Mali MBS2 bitcode (astc_encoder_MBS2.c)" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
                  cat astc_encoder_MBS2.c >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
